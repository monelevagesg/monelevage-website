<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Check your inbox | Mon Élevage</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500;1,600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper:#FAF7F2; --paper-deep:#F2EDE5;
    --navy:#0A1D3E; --navy-soft:#3A4A69;
    --gold:#D2A142; --gold-deep:#A87C28;
    --line:rgba(10,29,62,0.12);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--paper);
    color: var(--navy);
    font-family: 'Inter', sans-serif;
    font-weight: 400;
    font-size: 16px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  .site-header {
    display: flex;
    justify-content: center;
    padding: 1.75rem 1.25rem;
  }

  .site-header a { display: inline-block; line-height: 0; }

  .site-header img {
    height: 56px;
    width: auto;
    display: block;
  }

  main {
    max-width: 640px;
    margin: 0 auto;
    padding: 0.5rem 1.25rem 3rem;
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    justify-content: center;
    width: 100%;
  }

  h1, h2 {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 400;
    line-height: 1.05;
    color: var(--navy);
  }

  .eyebrow {
    font-size: 0.62rem;
    font-weight: 500;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 1rem;
  }

  h1 {
    font-size: clamp(2rem, 8vw, 2.75rem);
    margin-bottom: 1.5rem;
  }

  h2 {
    font-size: clamp(1.4rem, 5vw, 1.75rem);
    margin: 2rem 0 1rem;
  }

  p {
    margin-bottom: 1.1rem;
  }

  strong {
    font-family: 'Inter', sans-serif;
    font-weight: 600;
  }

  .question-list {
    list-style: none;
    margin-bottom: 1.5rem;
  }

  .question-list li {
    padding: 0.65rem 0;
    border-bottom: 1px solid var(--line);
  }

  .question-list li:last-child { border-bottom: none; }

  .signup-form {
    margin: 1.5rem 0;
  }

  .signup-form input[type="email"] {
    display: block;
    width: 100%;
    background: #fff;
    color: var(--navy);
    border: 1px solid var(--line);
    border-radius: 2px;
    padding: 0.9rem 1rem;
    font-family: 'Inter', sans-serif;
    font-size: 1rem;
    margin-bottom: 0.75rem;
  }

  .signup-form input[type="email"]::placeholder { color: var(--navy-soft); }

  .signup-form button {
    display: block;
    width: 100%;
    background: var(--gold);
    color: #fff;
    border: none;
    border-radius: 2px;
    padding: 0.9rem 1rem;
    font-family: 'Inter', sans-serif;
    font-size: 0.75rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    cursor: pointer;
    transition: background 0.2s ease;
  }

  .signup-form button:hover { background: var(--gold-deep); }
  .signup-form button:focus-visible { outline: 2px solid var(--gold-deep); outline-offset: 2px; }

  .row-success {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 2px;
    padding: 1.25rem 1.5rem;
    margin: 1.5rem 0;
  }

  .row-success p:last-child { margin-bottom: 0; }

  .note {
    font-size: 0.8rem;
    color: var(--navy-soft);
    margin-top: 1rem;
  }

  @media (min-width: 640px) {
    .site-header { padding: 2.25rem 1.25rem; }
    main { padding: 1rem 1.25rem 4rem; }
    .site-header img { height: 64px; }
  }
</style>
</head>
<body>

<header class="site-header">
  <a href="/" aria-label="Mon Élevage home">
    <img src="/images/mon_elevage_icon_light_text.svg" alt="Mon Élevage">
  </a>
</header>

<main>
  <p class="eyebrow">Check your inbox</p>
  <h1>The kit is on its way.</h1>

  <p>If it hasn't landed in a minute, look in your promotions folder or spam.</p>
</main>

</body>
</html>
